<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GOD'S CHILD | Faith-Inspired Streetwear</title>
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f6f6f6;
      --text: #111111;
      --muted: #666666;
      --border: #e5e5e5;
      --accent: #111111;
      --badge: #1a1a1a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html { scroll-behavior: smooth; }
    body { background: var(--bg); color: var(--text); line-height: 1.5; }

    /* Announcement Bar */
    .announcement-bar {
      background: var(--text);
      color: #fff;
      text-align: center;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 10px 16px;
      font-weight: 600;
    }

    /* Sticky Header */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      padding: 16px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.35rem;
      font-weight: 900;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--text);
    }

    nav { display: flex; gap: 28px; }
    nav a {
      text-decoration: none;
      color: var(--text);
      font-size: 0.88rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    nav a:hover { opacity: 0.6; }

    .header-actions { display: flex; align-items: center; gap: 18px; }
    .cart-btn {
      background: none;
      border: 1px solid var(--text);
      padding: 8px 16px;
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: 0.2s;
    }
    .cart-btn:hover { background: var(--text); color: #fff; }

    /* Hero Banner */
    .hero {
      position: relative;
      height: 82vh;
      min-height: 520px;
      background: linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.55)),
                  url('https://unsplash.com') center/cover no-repeat;
      display: flex;
      align-items: center;
      padding: 0 6%;
      color: #fff;
    }

    .hero-content { max-width: 620px; }
    .hero-tag {
      font-size: 0.82rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 14px;
      display: block;
      opacity: 0.9;
    }
    .hero h1 {
      font-size: clamp(2.4rem, 5vw, 4rem);
      font-weight: 900;
      line-height: 1.08;
      letter-spacing: -0.02em;
      margin-bottom: 18px;
      text-transform: uppercase;
    }
    .hero p {
      font-size: 1.05rem;
      margin-bottom: 28px;
      opacity: 0.92;
    }
    .btn-primary {
      display: inline-block;
      background: #fff;
      color: #111;
      padding: 14px 32px;
      font-size: 0.88rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-primary:hover { background: #e5e5e5; }

    /* Section Containers */
    section { padding: 72px 5%; }
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 20px;
      margin-bottom: 36px;
    }
    .section-title {
      font-size: 1.75rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    /* Filter Tabs */
    .filters { display: flex; gap: 10px; flex-wrap: wrap; }
    .filter-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 8px 18px;
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: 0.2s;
    }
    .filter-btn.active, .filter-btn:hover {
      background: var(--text);
      color: #fff;
      border-color: var(--text);
    }

    /* Product Grid */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 32px 24px;
    }

    .product-card {
      display: flex;
      flex-direction: column;
    }

    .product-img-wrap {
      position: relative;
      background: var(--surface);
      aspect-ratio: 4 / 5;
      overflow: hidden;
      margin-bottom: 14px;
    }

    .product-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }
    .product-card:hover .product-img-wrap img { transform: scale(1.04); }

    .badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background: var(--badge);
      color: #fff;
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 5px 10px;
    }

    .product-title {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .product-meta {
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .product-price {
      font-size: 0.98rem;
      font-weight: 800;
      margin-bottom: 12px;
    }

    /* Size Selector */
    .size-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .sizes { display: flex; gap: 6px; }
    .size-pill {
      border: 1px solid var(--border);
      background: #fff;
      width: 34px;
      height: 32px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
    }
    .size-pill.selected {
      background: var(--text);
      color: #fff;
      border-color: var(--text);
    }

    .size-guide-link {
      font-size: 0.75rem;
      color: var(--muted);
      text-decoration: underline;
      cursor: pointer;
      background: none;
      border: none;
    }

    .add-bag-btn {
      width: 100%;
      background: var(--text);
      color: #fff;
      border: none;
      padding: 13px;
      font-size: 0.82rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: 0.2s;
    }
    .add-bag-btn:hover { background: #333; }

    /* Brand Mission / About Split */
    .mission-section {
      background: var(--surface);
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 48px;
      align-items: center;
    }
    .mission-img img {
      width: 100%;
      aspect-ratio: 4/3;
      object-fit: cover;
    }
    .mission-text h2 {
      font-size: 2rem;
      font-weight: 900;
      text-transform: uppercase;
      margin-bottom: 16px;
    }
    .mission-text p {
      color: #333;
      margin-bottom: 16px;
      font-size: 1rem;
    }
    .scripture-box {
      border-left: 3px solid var(--text);
      padding-left: 16px;
      margin-top: 24px;
      font-style: italic;
      font-weight: 600;
    }

    /* Slide-out Cart Drawer */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      z-index: 200;
    }
    .overlay.open { display: block; }

    .cart-drawer {
      position: fixed;
      top: 0;
      right: -420px;
      width: 100%;
      max-width: 400px;
      height: 100vh;
      background: #fff;
      z-index: 201;
      display: flex;
      flex-direction: column;
      transition: right 0.3s ease;
    }
    .cart-drawer.open { right: 0; }

    .drawer-header {
      padding: 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .drawer-header h3 {
      font-size: 1.05rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .close-btn {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
    }

    .cart-items {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }
    .cart-item {
      display: flex;
      gap: 14px;
      padding-bottom: 16px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    .cart-item img {
      width: 70px;
      height: 85px;
      object-fit: cover;
      background: var(--surface);
    }
    .cart-item-info { flex: 1; }
    .cart-item-title { font-weight: 700; font-size: 0.92rem; }
    .cart-item-sub { font-size: 0.8rem; color: var(--muted); margin: 3px 0 8px; }
    .qty-controls { display: flex; align-items: center; gap: 10px; }
    .qty-btn {
      width: 24px;
      height: 24px;
      border: 1px solid var(--border);
      background: #fff;
      cursor: pointer;
      font-weight: 700;
    }

    .drawer-footer {
      padding: 20px;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }
    .subtotal-row {
      display: flex;
      justify-content: space-between;
      font-weight: 800;
      font-size: 1.05rem;
      margin-bottom: 14px;
    }

    /* Modals (Size Guide & Checkout) */
    .modal {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #fff;
      padding: 28px;
      width: 92%;
      max-width: 460px;
      z-index: 300;
      display: none;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    }
    .modal.open { display: block; }
    .modal h3 {
      font-size: 1.2rem;
      font-weight: 900;
      text-transform: uppercase;
      margin-bottom: 14px;
    }
